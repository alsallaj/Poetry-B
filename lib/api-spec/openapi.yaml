openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: learning
    description: Learning path stages, levels and progress
  - name: openai
    description: OpenAI AI chat operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /stages:
    get:
      operationId: listStages
      tags: [learning]
      summary: List all learning stages
      responses:
        "200":
          description: List of stages with their levels
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Stage"

  /levels/{levelNumber}:
    get:
      operationId: getLevel
      tags: [learning]
      summary: Get a specific level by number
      parameters:
        - name: levelNumber
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Level details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LevelDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /progress:
    get:
      operationId: getProgress
      tags: [learning]
      summary: Get user progress
      responses:
        "200":
          description: User progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProgress"

  /progress/complete-level:
    post:
      operationId: completeLevel
      tags: [learning]
      summary: Mark a level as completed and award XP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteLevelBody"
      responses:
        "200":
          description: Updated progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProgress"

  /learning/start-level/{levelNumber}:
    post:
      operationId: startLevelSession
      tags: [learning]
      summary: Start a learning session for a level (creates a conversation)
      parameters:
        - name: levelNumber
          in: path
          required: true
          schema:
            type: integer
      responses:
        "201":
          description: Created conversation for this level
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiConversation"

  /openai/conversations:
    get:
      operationId: listOpenaiConversations
      tags: [openai]
      summary: List all conversations
      responses:
        "200":
          description: List of conversations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OpenaiConversation"
    post:
      operationId: createOpenaiConversation
      tags: [openai]
      summary: Create a new conversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOpenaiConversationBody"
      responses:
        "201":
          description: Created conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiConversation"

  /openai/conversations/{id}:
    get:
      operationId: getOpenaiConversation
      tags: [openai]
      summary: Get conversation with messages
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Conversation with messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiConversationWithMessages"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: deleteOpenaiConversation
      tags: [openai]
      summary: Delete a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /openai/conversations/{id}/messages:
    get:
      operationId: listOpenaiMessages
      tags: [openai]
      summary: List messages in a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OpenaiMessage"
    post:
      operationId: sendOpenaiMessage
      tags: [openai]
      summary: Send a text message and receive a streaming text response
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendOpenaiMessageBody"
      responses:
        "200":
          description: SSE stream of assistant text chunks
          content:
            text/event-stream: {}

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    Stage:
      type: object
      properties:
        id:
          type: integer
        order:
          type: integer
        nameAr:
          type: string
        nameEn:
          type: string
        descriptionAr:
          type: string
        descriptionEn:
          type: string
        icon:
          type: string
        levelStart:
          type: integer
        levelEnd:
          type: integer
        levels:
          type: array
          items:
            $ref: "#/components/schemas/LevelSummary"
      required: [id, order, nameAr, nameEn, descriptionAr, descriptionEn, icon, levelStart, levelEnd, levels]

    LevelSummary:
      type: object
      properties:
        id:
          type: integer
        levelNumber:
          type: integer
        nameAr:
          type: string
        nameEn:
          type: string
        skillKey:
          type: string
        xpReward:
          type: integer
      required: [id, levelNumber, nameAr, nameEn, skillKey, xpReward]

    LevelDetail:
      type: object
      properties:
        id:
          type: integer
        stageId:
          type: integer
        levelNumber:
          type: integer
        nameAr:
          type: string
        nameEn:
          type: string
        skillKey:
          type: string
        skillDescriptionEn:
          type: string
        roleplaysScenarioAr:
          type: string
        roleplaysScenarioEn:
          type: string
        xpReward:
          type: integer
      required: [id, stageId, levelNumber, nameAr, nameEn, skillKey, skillDescriptionEn, roleplaysScenarioAr, roleplaysScenarioEn, xpReward]

    UserProgress:
      type: object
      properties:
        id:
          type: integer
        currentLevel:
          type: integer
        totalXp:
          type: integer
        completedLevels:
          type: array
          items:
            type: integer
      required: [id, currentLevel, totalXp, completedLevels]

    CompleteLevelBody:
      type: object
      properties:
        levelNumber:
          type: integer
      required: [levelNumber]

    OpenaiConversation:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        levelId:
          type: integer
          nullable: true
        createdAt:
          type: string
          format: date-time
      required: [id, title, createdAt]

    OpenaiMessage:
      type: object
      properties:
        id:
          type: integer
        conversationId:
          type: integer
        role:
          type: string
        content:
          type: string
        createdAt:
          type: string
          format: date-time
      required: [id, conversationId, role, content, createdAt]

    CreateOpenaiConversationBody:
      type: object
      properties:
        title:
          type: string
        levelId:
          type: integer
          nullable: true
      required: [title]

    SendOpenaiMessageBody:
      type: object
      properties:
        content:
          type: string
      required: [content]

    OpenaiConversationWithMessages:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        levelId:
          type: integer
          nullable: true
        createdAt:
          type: string
          format: date-time
        messages:
          type: array
          items:
            $ref: "#/components/schemas/OpenaiMessage"
      required: [id, title, createdAt, messages]

    ApiError:
      type: object
      properties:
        error:
          type: string
      required: [error]
